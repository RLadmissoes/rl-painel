<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RL Demandas · Painel</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#005A8A">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RL Demandas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--azul:#005A8A;--azul2:#4C9BD6;--azf:#DBEBF8;--azt:#0B3D66;--fundo:#F4F7F9;--borda:#C3CAD0;--texto:#22303A;--t2:#5A6570;--lar:#FCE3CC;--lart:#8A3D00;--cin:#ECEEF1;--cint:#4E5660;--fim:#D3DCEA;--fimt:#1F3B73}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:'Segoe UI',Roboto,Arial,sans-serif;font-size:14px}
button,input,select{font:inherit;color:var(--texto)}
.oculto{display:none!important}
/* login */
#tlogin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.caixa{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:26px 24px;width:100%;max-width:360px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.logo .q{width:40px;height:40px;border-radius:8px;background:var(--azul);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.caixa input{width:100%;padding:10px 11px;border:1px solid var(--borda);border-radius:6px;margin:6px 0 12px}
.btn{border:1px solid var(--borda);background:#fff;border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#EEF3F6}.btn.p{background:var(--azul);border-color:var(--azul);color:#fff;font-weight:600}
.caixa .btn.p{width:100%;padding:10px}
.msg{color:var(--lart);font-size:13px;min-height:18px;margin-top:8px}
.info{color:var(--t2);font-size:12.5px}
/* app */
header{background:var(--azul);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header .tit{font-weight:700;font-size:15px}
header .at{font-size:12px;opacity:.9;flex:1}
header .btn{background:transparent;border-color:rgba(255,255,255,.5);color:#fff;padding:5px 10px}
nav{display:flex;gap:4px;padding:8px 12px 0;overflow-x:auto;background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:46px;z-index:4}
nav button{border:none;background:none;padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--t2)}
nav button.on{border-bottom-color:var(--azul);color:var(--azul);font-weight:600}
main{padding:14px 16px 40px;max-width:1300px;margin:0 auto}
h2{font-size:17px;margin:14px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.kpi{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:10px 12px;cursor:default}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--t2);font-size:12.5px}
.kpi.al b{color:var(--lart)}
.card{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtros select,.filtros input{padding:7px 8px;border:1px solid var(--borda);border-radius:6px;background:#fff;max-width:100%}
.filtros input{flex:1;min-width:160px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}
th{background:var(--cin);text-align:left;padding:7px 8px;font-weight:600;white-space:nowrap;position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid #E6E9EC;vertical-align:top}
.tab{overflow:auto;border:1px solid var(--borda);border-radius:8px;background:#fff}
tr.l{cursor:pointer}tr.l:hover td{background:#F4F8FA}
.st{border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;display:inline-block}
.s-and{background:var(--azf);color:var(--azt)}.s-faz{background:var(--cin);color:var(--cint)}
.s-pau{background:#fff;color:var(--cint);border:1px dashed #8D949B}.s-con{background:var(--fim);color:var(--fimt)}
.s-atr{background:var(--lar);color:var(--lart)}
.pb{display:inline-block;width:60px;height:6px;background:#E6E9EC;border-radius:3px;vertical-align:middle;overflow:hidden}
.pb i{display:block;height:100%;background:var(--azul2)}
.vazio{color:var(--t2);padding:14px;text-align:center}
/* ficha */
#ov{position:fixed;inset:0;background:rgba(20,40,55,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 10px}
.ficha{background:#fff;border-radius:10px;width:100%;max-width:860px;padding:18px 20px 24px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.ficha h3{margin:0 0 6px;font-size:18px}
.sec{margin:16px 0 6px;font-weight:700;color:var(--azul);border-bottom:1px solid #D5DCE1;padding-bottom:3px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 18px}
.grade div span{display:block;color:#6B757D;font-size:11px;text-transform:uppercase;letter-spacing:.3px}
.txt{white-space:pre-wrap;line-height:1.45}
.ck{display:flex;gap:7px;padding:2px 0}
.ck .b{width:15px;height:15px;border:1.5px solid #5A6570;border-radius:3px;flex:none;font-size:11px;line-height:12px;text-align:center}
.fechar{float:right}
.fbar{position:relative;margin-bottom:10px}
.pset{position:absolute;z-index:10;background:#fff;border:1px solid var(--borda);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 12px;min-width:260px;max-width:92vw}
.pset label{display:flex;gap:8px;align-items:center;padding:6px 2px;cursor:pointer}
.hoje{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.pess{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column}
.pess span{font-size:12.5px;color:var(--azt)}.pess.zero{background:var(--lar);border-color:#F1C9A4}.pess.zero span{color:var(--lart)}
th.ord{cursor:pointer;user-select:none}th.ord:hover{color:var(--azul)}
.graf .gl{display:flex;align-items:center;gap:8px;margin:5px 0}.gn{width:90px;flex:none;font-size:13px}.gv{width:52px;text-align:right;font-size:13px;flex:none}
.gb{flex:1;height:14px;background:#EEF1F3;border-radius:4px;position:relative}.gb i{display:block;height:100%;background:var(--azul2);border-radius:4px}
.gb em{position:absolute;top:-3px;bottom:-3px;width:2px;background:#22303A}
.gwrap{overflow:auto;border:1px solid var(--borda);border-radius:8px;background:#fff;max-height:70vh}
.grow{display:flex;min-height:34px;border-bottom:1px solid #EEF1F3}
.grow.l{cursor:pointer}.grow.l:hover .gnome{background:#F4F8FA}
.gnome{position:sticky;left:0;z-index:2;background:#fff;width:230px;flex:none;padding:4px 8px;border-right:1px solid #E1E5E8;font-size:12.5px;overflow:hidden}
.gnome b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gnome span{color:var(--t2);font-size:11px;white-space:nowrap}
.garea{position:relative;flex:none}
.gtopo{position:sticky;top:0;z-index:3;background:#fff;min-height:24px}.gtopo .gnome{background:#ECEEF1}
.gtopo .garea{background:#ECEEF1}
.gsem{position:absolute;top:4px;font-size:11px;color:var(--t2);padding-left:3px;border-left:1px solid #C3CAD0;height:16px}
.gcorpo{position:relative}
.gfundo{position:absolute;top:0;bottom:0;left:230px;pointer-events:none}
.gfds{position:absolute;top:0;bottom:0;background:#F4F6F8}
.ghj{position:absolute;top:0;bottom:0;width:2px;background:#E07B1F;z-index:1}
.ggrupo{background:#F7F9FA;min-height:26px}.ggrupo .gnome{background:#F7F9FA;font-weight:700;color:var(--azul)}
.gbar{position:absolute;top:9px;height:16px;border-radius:4px;border:1px solid #22303A;box-sizing:border-box}
.gbar.s-and{background:#4C9BD6}.gbar.s-faz{background:#D5D9DE}.gbar.s-atr{background:#F28E2B}.gbar.s-con{background:#1F4E89}.gbar.s-pau{background:#fff;border:1px dashed #22303A}
.gorig{position:absolute;top:27px;height:4px;border-radius:2px;background:#5A6570}
.ghach{position:absolute;top:9px;height:16px;border-radius:0 4px 4px 0;box-sizing:border-box}
.ghach.atr{background:repeating-linear-gradient(135deg,#F28E2B 0 3px,#FFFFFF 3px 6px);border:1px solid #22303A}
.ghach.adi{background:repeating-linear-gradient(135deg,#1F4E89 0 3px,#FFFFFF 3px 6px);border:1px solid #22303A}
.gdesv{position:absolute;top:9px;font-style:normal;font-size:11px;font-weight:700;white-space:nowrap;background:rgba(255,255,255,.85);padding:0 3px;border-radius:3px}
.gdesv.atr{color:#8A3D00}.gdesv.adi{color:#1F3B73}
.gleg .ghach{position:static;display:inline-block;width:22px;height:10px;border-radius:2px}
.gconc{position:absolute;top:8px;font-style:normal;font-size:13px;color:#1F3B73;margin-left:-6px}
.gleg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-bottom:6px}
.gleg span{display:flex;align-items:center;gap:5px}.gleg .gbar,.gleg .gorig,.gleg .ghj{position:static;display:inline-block;width:22px;height:10px}.gleg .gorig{height:4px}.gleg .ghj{width:3px;height:12px}
@media (max-width:640px){.gnome{width:150px}.gfundo{left:150px}}
@media print{.gwrap{max-height:none;overflow:visible}.gtopo{position:static}}
/* compacto: filtros, datas e botões menores */
.filtros{gap:4px;margin-bottom:6px;align-items:center}
.filtros select,.filtros input{padding:4px 6px;font-size:13px;border-radius:5px;height:30px}
.filtros input[type=date]{width:auto}
.filtros .btn,.fbar .btn{padding:4px 9px;font-size:13px;height:30px}
.fbar{margin-bottom:6px}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--t2);padding:0 4px;cursor:pointer}
.filtros .chk input{flex:0 0 auto;min-width:0;width:16px;height:16px;padding:0;margin:0}
.anexo{margin-top:14px}.quebra-word{display:none}
.anexo{overflow-x:auto}
.tgantt{min-width:900px}
@page paisagem{size:A4 landscape;margin:10mm}
.manual{margin:10px 0 14px}.manual h3{margin:0 0 4px;font-size:15px;color:#005A8A}
.manual textarea{width:100%;min-height:90px;box-sizing:border-box;font:inherit;font-size:13px;padding:8px;border:1px solid #C3CAD0;border-radius:6px;background:#FFFFFF;resize:vertical}
.manual textarea.falta{border:2px solid #E07B1F;background:#FFF6EE}
.manual .obg{color:#8A3D00;font-size:11px;font-weight:600;margin-left:6px}
.manual .txtp{display:none;white-space:pre-wrap;line-height:1.45}
.aviso-rel{background:#FCE3CC;color:#8A3D00;border-radius:6px;padding:8px 10px;margin:8px 0;font-weight:600}
@media print{.manual textarea,.manual .obg{display:none!important}.manual .txtp{display:block}
 #rel.incompleto>*{display:none!important}
 #rel.incompleto::before{content:"Relatório incompleto: preencha a Introdução e a Conclusão no painel antes de imprimir ou salvar em PDF.";display:block;font:600 14pt sans-serif;color:#8A3D00;padding:20mm 0}}
@media print{.anexo{break-before:page;page:paisagem;overflow:visible}.tgantt{min-width:0}.tgantt thead{display:table-header-group}.tgantt tr{break-inside:avoid}}
.relcab{padding:7px 10px!important;margin-bottom:6px!important}
.kpis{gap:6px}.kpi{padding:7px 10px}.kpi b{font-size:18px}
h2{margin:10px 0 6px}
.relcab{background:#fff;border:1px solid var(--borda);border-left:4px solid var(--azul);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.relcab .logo-rl{height:54px;width:auto;margin-right:6px}
/* relatórios: Arial 12, texto preto */
#rel:not(.r2) *{font-family:Arial,Helvetica,sans-serif!important;color:#000!important}
#rel td,#rel th,#rel p,#rel li,#rel .info,#rel .card,#rel .manual .txtp,#rel .manual textarea,#rel .relcab span{font-size:12pt}
#rel h2,#rel .manual h3{font-size:14pt}
#rel .relcab b{font-size:15pt}
#rel .anexo .info{font-size:9pt}
#rel .anexo h2{font-size:13pt}
.relp{padding:10px 12px}
.relat{border-top:1px solid #E6E9EC;margin-top:8px;padding-top:8px}
.rl{margin:4px 0 0 4px;font-size:13px}
.obs{background:#F4F7F9;border-left:3px solid var(--azul2);padding:4px 8px;margin:3px 0 2px;border-radius:3px;white-space:pre-wrap}
.relck{margin:6px 0 0 4px}
.so-papel{display:none}
.fichabot{float:right;display:flex;gap:6px}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .so-papel{display:block}
 body.so-ficha #app{display:none!important}
 body.so-ficha #ov{position:static;background:none;padding:0;display:block!important;overflow:visible}
 body.so-ficha .ficha{box-shadow:none;max-width:none;padding:0}
 #ov:not(.oculto) ~ *{}
 .tab{overflow:visible}
 header,nav,.nao-imprime,#tlogin{display:none!important}
 body,html{background:#fff}
 main{padding:0;max-width:none}
 .card,.tab,.kpi,.relcab{break-inside:avoid;box-shadow:none}
 th{position:static}
 @page{size:A4;margin:12mm}
}
@media (max-width:640px){
 header .at{flex-basis:100%;order:3}
 nav{top:70px}
 .esconde-cel{display:none}
 td,th{padding:6px}
}
/* ================= relatórios semanal e mensal (modelo aprovado 22/11/2026) ================= */
#rel.r2{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:18px 22px;max-width:900px;margin:0 auto;line-height:1.45}
#rel.r2 *{font-family:Arial,Helvetica,sans-serif!important}
#rel.r2 .r2capa{position:relative;width:100%;max-width:620px;margin:0 auto 14px;aspect-ratio:210/297;background:#FFFFFF no-repeat 0 0/100% 100%;container-type:inline-size;box-shadow:0 1px 6px rgba(0,0,0,.18)}
#rel.r2 .r2capa .ctit{position:absolute;left:8%;right:8%;top:18%;text-align:center}
#rel.r2 .r2capa .t1{font-size:4.6cqw;font-weight:700;line-height:1.15}
#rel.r2 .r2capa .t2{font-size:3.4cqw;font-weight:700;margin-top:1.5cqw}
#rel.r2 .r2capa .t3{font-size:2.2cqw;font-weight:700;margin-top:1cqw}
#rel.r2 .r2capa .csetor{position:absolute;right:9%;left:30%;top:66%;text-align:right}
#rel.r2 .r2capa .setor{font-size:3.4cqw;font-weight:700}
#rel.r2 .r2capa .pes{font-size:1.9cqw;margin-top:.6cqw}
#rel.r2 .r2capa .mes{position:absolute;left:0;right:0;top:83%;text-align:center;font-size:2.7cqw;font-weight:700}
#rel.r2 h1{font-size:13pt;margin:16px 0 7px;text-transform:uppercase;color:#000;break-after:avoid}
#rel.r2 h2{font-size:11pt;margin:10px 0 5px;color:#000;break-after:avoid}
#rel.r2 p{margin:0 0 8px;text-align:justify;font-size:11pt}
#rel.r2 .r2cards{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid #C3CAD0;margin:10px 0;break-inside:avoid}
#rel.r2 .r2card{padding:7px 5px;text-align:center;border-right:1px solid #E1E5E8;border-bottom:1px solid #E1E5E8;background:#F7FAFC}
#rel.r2 .r2card:nth-child(4n){border-right:0}
#rel.r2 .r2card b{display:block;font-size:19pt;color:#005A8A;line-height:1.1}
#rel.r2 .r2card .l{font-size:8.5pt;font-weight:700;display:block}
#rel.r2 .r2card .c{font-size:7.5pt;color:#5A6570;display:block}
#rel.r2 .r2card .c em{font-style:normal;font-weight:700;color:#1F4E89}
#rel.r2 .r2card .c em.pior{color:#8A3D00}#rel.r2 .r2card .c em.sr{color:#5A6570;font-weight:400}
#rel.r2 table.t{width:100%;border-collapse:collapse;font-size:9pt;margin:5px 0 9px}
#rel.r2 table.t th{background:#005A8A;color:#fff;text-align:left;padding:4px 5px;font-size:9pt;position:static}
#rel.r2 table.t td{padding:3px 5px;border-bottom:1px solid #DDE3E7;vertical-align:top;font-size:9pt}
#rel.r2 table.t tr{break-inside:avoid}
#rel.r2 table.t tr.g td{background:#EEF3F7;font-weight:700;color:#005A8A}
#rel.r2 table.t td.n,#rel.r2 table.t th.n{text-align:right;white-space:nowrap}
#rel.r2 table.t td.cinza{color:#5A6570}
#rel.r2 .tag{display:inline-block;border-radius:8px;padding:0 6px;font-size:8pt;font-weight:700;white-space:nowrap}
#rel.r2 .tag.ok{background:#D3DCEA;color:#1F3B73}#rel.r2 .tag.atr{background:#FCE3CC;color:#8A3D00}
#rel.r2 .tag.and{background:#DBEBF8;color:#0B3D66}#rel.r2 .tag.faz{background:#ECEEF1;color:#4E5660}
#rel.r2 .sobre{color:#8A3D00;font-weight:700}
#rel.r2 .niv{font-weight:700;text-align:center;font-size:8pt}
#rel.r2 .niv.crit{background:#F28E2B}#rel.r2 .niv.alto{background:#FCE3CC;color:#8A3D00}
#rel.r2 .niv.medio{background:#DBEBF8;color:#0B3D66}#rel.r2 .niv.baixo{background:#ECEEF1;color:#4E5660}
#rel.r2 .fig{border:1px solid #E1E5E8;padding:5px;margin:6px 0 2px;break-inside:avoid}
#rel.r2 .fig svg{display:block;width:100%;height:auto}
#rel.r2 .leg{font-size:8.5pt;text-align:center;font-style:italic;margin-bottom:8px}
#rel.r2 .fonte{font-size:8pt;border-top:1px solid #C3CAD0;padding-top:4px;margin-top:8px}
#rel.r2 .ass{margin-top:28px;text-align:right;font-size:11pt;line-height:1.5;break-inside:avoid}
#rel.r2 .vaz{color:#5A6570;font-style:italic;font-size:10pt}
/* textos editáveis */
#rel.r2 .ed{position:relative;border:1px dashed #4C9BD6;border-radius:4px;padding:8px 8px 2px;margin:8px 0 9px;background:#FBFDFF}
#rel.r2 .ctl{position:absolute;top:-10px;right:6px;display:flex;gap:4px;z-index:2}
#rel.r2 .ctl span,#rel.r2 .ctl button{font-family:'Segoe UI',Arial,sans-serif!important;font-size:10px;border-radius:8px;padding:1px 7px;border:1px solid #4C9BD6;background:#fff;color:#0B3D66;cursor:pointer;white-space:nowrap}
#rel.r2 .ctl span.edit{border-color:#E07B1F;color:#8A3D00;background:#FFF6EE}
#rel.r2 [contenteditable]{outline:none}
#rel.r2 [contenteditable]:focus{background:#fff;box-shadow:inset 0 0 0 1px #4C9BD6}
#rel.r2 td[contenteditable]{background:#FBFDFF}
#rel.r2 td[data-ed].editado{background:#FFF6EE}
#rel.r2 .motivo:empty::before{content:"clique para informar o motivo";color:#9AA3AB;font-style:italic}
#rel.r2 .inserir{position:relative;margin:2px 0 6px}
#rel.r2 .inserir>button,#rel.r2 .maislinha{font-family:'Segoe UI',Arial,sans-serif!important;font-size:12px;border:1px solid #4C9BD6;background:#fff;color:#005A8A;border-radius:6px;padding:3px 10px;cursor:pointer}
#rel.r2 .menu{position:absolute;z-index:15;background:#fff;border:1px solid #C3CAD0;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:260px;max-height:60vh;overflow:auto}
#rel.r2 .menu div{padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12.5px}
#rel.r2 .menu div:hover{background:#EEF3F7}
#rel.r2 .menu div.usado{color:#9AA3AB}
#rel.r2 .pp{position:relative;border:1px dashed #4C9BD6;border-radius:4px;padding:8px 8px 2px;margin:12px 0 6px;background:#FBFDFF}
#rel.r2 .pp p{margin:0 0 4px}
#rel.r2 .tirar{border:0;background:none;color:#8A3D00;cursor:pointer;font-size:12px;padding:0 3px}
#rel.r2 .metas{border:1px solid #C3CAD0;border-radius:6px;padding:6px 10px;margin:6px 0 12px;background:#F7FAFC;font-size:12.5px}
#rel.r2 .metas label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
#rel.r2 .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;margin-top:6px}
#rel.r2 .pgrid>div{display:flex;gap:6px;align-items:center}

<body>
<div id="tlogin">
 <div class="caixa">
  <div class="logo"><div class="q">RL</div><div><b>RL Demandas</b><br><span class="info">Painel online · só leitura</span></div></div>
  <label for="senha">Senha do painel</label>
  <input id="senha" type="password" autocomplete="current-password" autofocus>
  <button class="btn p" id="entrar">Entrar</button>
  <div class="msg" id="msg"></div>
  <div class="info" style="margin-top:10px">Os dados ficam criptografados. Sem a senha, ninguém consegue lê-los.</div>
 </div>
</div>
<div id="app" class="oculto">
 <header><span class="tit">RL Demandas</span><span class="at" id="atual"></span>
  <button class="btn" id="bAtu" title="Buscar o retrato mais recente">↻ Atualizar</button><button class="btn" id="bSair">Sair</button></header>
 <nav id="abas"></nav>
 <main id="conteudo"></main>
</div>
<div id="ov" class="oculto" onclick="if(event.target===this)fecharFicha()"><div class="ficha" id="ficha"></div></div>
<script>
"use strict";
// ---------------------------------------------------------------- dados
const P = new URLSearchParams(location.search);
function repoDaPagina(){
  if(P.get("repo")) return P.get("repo");
  const h = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const seg = location.pathname.split("/").filter(Boolean);
  return h && seg.length ? h[1] + "/" + seg[0] : null;
}
async function baixarPacote(){
  if(window.RETRATO_DEMO) return window.RETRATO_DEMO;
  if(P.get("arquivo")) { const r = await fetch(P.get("arquivo") + "?t=" + Date.now(), {cache:"no-store"}); if(!r.ok) throw new Error("arquivo"); return await r.text(); }
  const repo = repoDaPagina(); if(!repo) throw new Error("Não achei o repositório desta página.");
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/retrato.json?ref=dados&t=${Date.now()}`,
      {headers:{Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
    if(r.ok) return await r.text();
  } catch(e) {}
  const r2 = await fetch(`https://raw.githubusercontent.com/${repo}/dados/retrato.json?t=${Date.now()}`, {cache:"no-store"});
  if(!r2.ok) throw new Error("Ainda não há retrato publicado (o transmissor já enviou?).");
  return await r2.text();
}
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrirPacote(texto, senha){
  const d = JSON.parse(texto);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(d.sal), iterations:d.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(d.iv)}, chave, b64(d.dados));
  const fluxo = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(fluxo).text());
}
let D = null, SENHA = null, ABA = "painel";
async function carregar(senha){
  const texto = await baixarPacote();
  try { D = await abrirPacote(texto, senha); }
  catch(e) { throw new Error("Senha incorreta."); }
  SENHA = senha; indexar(); if(!SEL) iniciarFiltro();
}
// ---------------------------------------------------------------- utilidades
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dia = s => { if(!s) return null; const [a,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(a, m-1, d); };
const br = s => { const x = dia(s); return x ? x.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—"; };
const brh = s => s ? br(s) + " " + String(s).slice(11,16) : "—";
const hm = m => { m = Math.round(m||0); return Math.floor(m/60) + "h" + String(m%60).padStart(2,"0"); };
let HOJE, U = {}, OB = {}, CL = {}, DI = {}, SE = {}, A = {}, TOT = {}, EV = {}, PE = {}, RO = {}, VE = {}, HR = {};
function indexar(){
  HOJE = dia(D.hoje);
  U = {}; D.usuarios.forEach(u => U[u.login] = u);
  OB = {}; D.obras.forEach(o => OB[o.id] = o); CL = {}; D.clientes.forEach(c => CL[c.id] = c);
  DI = {}; D.disciplinas.forEach(d => DI[d.id] = d); SE = {}; D.setores.forEach(s => SE[s.id] = s);
  A = {}; D.atividades.forEach(a => A[a.id] = a);
  const grupo = (lista, k) => { const o = {}; lista.forEach(x => (o[x[k]] = o[x[k]] || []).push(x)); return o; };
  EV = grupo(D.eventos, "atividade_id"); PE = grupo(D.pedidos, "atividade_id"); RO = grupo(D.rodadas, "atividade_id");
  VE = grupo(D.verificacoes, "atividade_id"); HR = grupo(D.horas, "atividade_id");
  TOT = {}; D.horas_totais.forEach(t => { TOT[t.atividade_id] = (TOT[t.atividade_id]||0) + t.minutos; });
}
// ---------------------------------------------------------------- filtro global de setores
let SEL = null;                                           // Set de ids de setor escolhidos
function setoresAtivos(){ return D.setores.filter(s => s.ativo !== false).sort((a,b)=>(a.ordem||0)-(b.ordem||0)); }
function setorPadrao(){
  const s = D.setores.find(x => x.id === "INS") || D.setores.find(x => /instala/i.test(x.nome||""));
  return s ? [s.id] : setoresAtivos().map(x => x.id);
}
function iniciarFiltro(){
  let salvo = null; try { salvo = JSON.parse(localStorage.getItem("rl_setores") || "null"); } catch(e) {}
  const validos = new Set(D.setores.map(s => s.id));
  const lista = Array.isArray(salvo) ? salvo.filter(x => validos.has(x)) : [];
  SEL = new Set(lista.length ? lista : setorPadrao());
}
function guardarFiltro(){ try { localStorage.setItem("rl_setores", JSON.stringify([...SEL])); } catch(e) {} }
const noFiltro = setor => SEL.has(setor);
const ativNoFiltro = a => !!a && SEL.has(a.setor);
const visiveis = () => D.atividades.filter(a => SEL.has(a.setor));
function textoFiltro(){
  const at = setoresAtivos();
  if(at.every(s => SEL.has(s.id))) return "Todos os setores";
  const n = [...SEL].map(id => (SE[id]||{}).nome || setorSigla(id));
  return n.length <= 2 ? n.join(" + ") : n.length + " setores";
}
function barraFiltro(){
  const at = setoresAtivos();
  return `<div class="fbar nao-imprime"><button class="btn" id="bSet">🏢 Setores: <b>${esc(textoFiltro())}</b> ▾</button>
   <div id="pSet" class="pset oculto">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px"><button class="btn" data-acao="todos">Todos</button><button class="btn" data-acao="padrao">Só Instalações</button></div>
    ${at.map(s => `<label><input type="checkbox" value="${s.id}" ${SEL.has(s.id)?"checked":""}> <b>${esc(s.sigla)}</b> ${esc(s.nome||"")}</label>`).join("")}
    <div style="text-align:right;margin-top:6px"><button class="btn p" id="okSet">Aplicar</button></div></div></div>`;
}
function ligarFiltro(){
  const b = document.getElementById("bSet"), p = document.getElementById("pSet");
  b.onclick = () => p.classList.toggle("oculto");
  p.querySelectorAll("[data-acao]").forEach(x => x.onclick = () => {
    const marcar = x.dataset.acao === "todos" ? setoresAtivos().map(s=>s.id) : setorPadrao();
    p.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = marcar.includes(c.value)); });
  document.getElementById("okSet").onclick = () => {
    const esc_ = [...p.querySelectorAll("input:checked")].map(c => c.value);
    if(!esc_.length){ alert("Escolha pelo menos um setor."); return; }
    SEL = new Set(esc_); guardarFiltro(); telaApp(); };
}
const nome = l => U[l] ? U[l].nome : (l || "—");
const curto = l => nome(l).split(" ")[0];
// diferença entre o prazo e o fim real: atraso (concluiu depois / ainda aberta com prazo vencido) ou adiantada (concluiu antes)
function desvio(a){
  const p = dia(a.prazo); if(!p) return null;
  if(a.status === "Concluída" && a.concluida_em){ const c = dia(a.concluida_em), n = Math.round((c - p) / 864e5);
    if(n > 0) return {tipo:"atr", de:p, ate:c, dias:n};
    if(n < 0) return {tipo:"adi", de:c, ate:p, dias:-n};
    return null; }
  if(a.status !== "Concluída" && p < HOJE) return {tipo:"atr", de:p, ate:HOJE, dias:Math.round((HOJE - p) / 864e5)};
  return null;
}
const txtDesvio = dv => !dv ? "" : dv.tipo === "atr" ? `+${dv.dias} ${dv.dias===1?"dia":"dias"}` : `${dv.dias} ${dv.dias===1?"dia":"dias"} antes`;
function temOriginal(a){ return (a.prazo_original && a.prazo_original !== a.prazo) || (a.inicio_original && a.data_inicio && a.inicio_original !== a.data_inicio); }
function atrasada(a){ return a.status !== "Concluída" && a.prazo && dia(a.prazo) < HOJE; }
function situacao(a){
  if(atrasada(a)) return ["Atrasada","s-atr"];
  return {"Em andamento":["Em andamento","s-and"],"A fazer":["A fazer","s-faz"],"Pausada":["Pausada","s-pau"],"Concluída":["Concluída","s-con"]}[a.status] || [a.status||"—","s-faz"];
}
const chip = a => { const [t,c] = situacao(a); return `<span class="st ${c}">${t}</span>`; };
function prog(a){ const c = a.checklist||[]; if(!c.length) return ""; const f = c.filter(x=>x.feito).length;
  return `<span class="pb"><i style="width:${Math.round(100*f/c.length)}%"></i></span> <span class="info">${f}/${c.length}</span>`; }
const discSigla = a => (DI[a.disciplina_id]||{}).sigla || "";
const obraNome = id => (OB[id]||{}).nome || "—";
const setorSigla = s => (SE[s]||{}).sigla || s || "—";
function semana(d){ const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function noPeriodo(dt, ini, fim){ return dt >= ini && dt <= fim; }
// ---------------------------------------------------------------- telas
const ABAS = [["painel","Painel"],["ativ","Atividades"],["gantt","Cronograma"],["rel","Relatórios"],["horas","Horas"],["reun","Reuniões"],["prot","Protocolos"]];
function telaApp(){
  document.getElementById("tlogin").classList.add("oculto");
  document.getElementById("app").classList.remove("oculto");
  const g = new Date(D.gerado_em); const min = Math.round((Date.now() - g.getTime())/60000);
  document.getElementById("atual").textContent = `Atualizado em ${g.toLocaleDateString("pt-BR")} ${g.toTimeString().slice(0,5)}` +
    (min >= 0 ? ` (há ${min < 60 ? min + " min" : Math.round(min/60) + " h"})` : "") + ` · enviado por ${D.gerado_por||"?"}`;
  document.getElementById("abas").innerHTML = ABAS.map(([k,t]) => `<button data-k="${k}" class="${k===ABA?"on":""}">${t}</button>`).join("");
  document.querySelectorAll("#abas button").forEach(b => b.onclick = () => { ABA = b.dataset.k; telaApp(); });
  ({painel:tPainel, ativ:tAtiv, gantt:tGantt, rel:tRel, horas:tHoras, reun:tReun, prot:tProt})[ABA]();
  if(!document.getElementById("bSet")){ C().insertAdjacentHTML("afterbegin", barraFiltro()); ligarFiltro(); }
  if(ABA==="painel") ligarPorPessoa();
}
const C = () => document.getElementById("conteudo");
function linhaAtiv(a, extra=""){
  return `<tr class="l" data-a="${a.id}"><td>${chip(a)}</td><td><b>${esc(a.titulo)}</b><br><span class="info">${esc(obraNome(a.obra_id))} · ${esc(discSigla(a))}</span></td>
   <td>${esc(curto(a.responsavel))}</td><td class="esconde-cel">${esc(setorSigla(a.setor))}</td><td>${br(a.prazo)}${a.prazo_original && a.prazo_original!==a.prazo ? `<br><span class="info">orig. ${br(a.prazo_original)}</span>`:""}</td>
   <td class="esconde-cel">${prog(a)}</td><td class="esconde-cel">${hm(TOT[a.id])}${a.horas_estimadas ? ` / ${a.horas_estimadas}h` : ""}</td>${extra}</tr>`;
}
function tabelaAtiv(lista){
  if(!lista.length) return `<div class="vazio">Nenhuma atividade.</div>`;
  return `<div class="tab"><table><thead><tr><th>Situação</th><th>Atividade</th><th>Resp.</th><th class="esconde-cel">Setor</th><th>Prazo</th><th class="esconde-cel">Checklist</th><th class="esconde-cel">Horas</th></tr></thead><tbody>${lista.map(a=>linhaAtiv(a)).join("")}</tbody></table></div>`;
}
function ligarLinhas(){ document.querySelectorAll("tr[data-a]").forEach(t => t.onclick = () => abrirFicha(t.dataset.a)); }
function tPainel(){
  const at = visiveis(), abertas = at.filter(a => a.status !== "Concluída");
  const atr = abertas.filter(atrasada), sete = new Date(HOJE); sete.setDate(sete.getDate()+7);
  const prox = abertas.filter(a => !atrasada(a) && a.prazo && dia(a.prazo) <= sete).sort((x,y)=>dia(x.prazo)-dia(y.prazo));
  const ini7 = new Date(HOJE); ini7.setDate(ini7.getDate()-7);
  const conc7 = at.filter(a => a.status==="Concluída" && a.concluida_em && dia(a.concluida_em) >= ini7);
  const sem = semana(HOJE), horasSem = D.horas.filter(h => dia(h.data) >= sem && ativNoFiltro(A[h.atividade_id])).reduce((s,h)=>s+h.minutos,0);
  const pend = D.pedidos.filter(p => p.status === "Pendente" && ativNoFiltro(A[p.atividade_id]));
  let h = `<div class="kpis">
    <div class="kpi"><b>${abertas.filter(a=>a.status==="Em andamento").length}</b><span>em andamento</span></div>
    <div class="kpi al"><b>${atr.length}</b><span>atrasadas</span></div>
    <div class="kpi"><b>${prox.length}</b><span>vencem em 7 dias</span></div>
    <div class="kpi"><b>${conc7.length}</b><span>concluídas nos últimos 7 dias</span></div>
    <div class="kpi"><b>${hm(horasSem)}</b><span>horas lançadas nesta semana</span></div>
    <div class="kpi"><b>${pend.length}</b><span>pedidos pendentes</span></div></div>`;
  // por setor
  const setores = setoresAtivos().filter(s => SEL.has(s.id));
  h += `<h2>Por setor</h2><div class="tab"><table><thead><tr><th>Setor</th><th>Em andamento</th><th>Atrasadas</th><th>A fazer</th><th>Concluídas (7 dias)</th><th>Horas na semana</th></tr></thead><tbody>` +
    setores.map(s => { const da = at.filter(a=>a.setor===s.id);
      const hs = D.horas.filter(x => dia(x.data) >= sem && A[x.atividade_id] && A[x.atividade_id].setor===s.id).reduce((t,x)=>t+x.minutos,0);
      return `<tr><td><b>${esc(s.sigla)}</b> <span class="info">${esc(s.nome||"")}</span></td><td>${da.filter(a=>a.status==="Em andamento"&&!atrasada(a)).length}</td>
      <td>${da.filter(atrasada).length}</td><td>${da.filter(a=>a.status==="A fazer"&&!atrasada(a)).length}</td><td>${da.filter(a=>conc7.includes(a)).length}</td><td>${hm(hs)}</td></tr>`; }).join("") + `</tbody></table></div>`;
  h += blocoHoje() + blocoPorPessoa();
  h += `<h2>Atrasadas (${atr.length})</h2>` + tabelaAtiv(atr.sort((x,y)=>dia(x.prazo)-dia(y.prazo)));
  h += `<h2>Vencem nos próximos 7 dias (${prox.length})</h2>` + tabelaAtiv(prox);
  if(pend.length) h += `<h2>Pedidos pendentes (${pend.length})</h2><div class="tab"><table><thead><tr><th>Atividade</th><th>Pedido</th><th>Quem</th><th>Quando</th></tr></thead><tbody>` +
    pend.map(p => `<tr class="l" data-a="${p.atividade_id}"><td>${esc((A[p.atividade_id]||{}).titulo)}</td><td>${p.data_para ? "Término " + br(p.data_de) + " → " + br(p.data_para) : esc(p.tipo||"")}<br><span class="info">${esc(p.detalhe||"")}</span></td><td>${esc(curto(p.solicitante))}</td><td>${brh(p.criado_em)}</td></tr>`).join("") + `</tbody></table></div>`;
  C().innerHTML = h; ligarLinhas();
}
let FA = {setor:"", sit:"abertas", resp:"", obra:"", busca:""};
function tAtiv(){
  const opt = (v, t, sel) => `<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(t)}</option>`;
  const resp = [...new Set(visiveis().map(a=>a.responsavel))].filter(Boolean).sort((a,b)=>nome(a).localeCompare(nome(b)));
  const obras = [...new Set(visiveis().map(a=>a.obra_id))].filter(Boolean).sort((a,b)=>obraNome(a).localeCompare(obraNome(b)));
  C().innerHTML = `<div class="filtros nao-imprime">
    <select id="fsit">${[["abertas","Não concluídas"],["Em andamento","Em andamento"],["A fazer","A fazer"],["Pausada","Pausadas"],["atr","Atrasadas"],["Concluída","Concluídas"],["","Todas"]].map(([v,t])=>opt(v,t,FA.sit)).join("")}</select>
    <select id="fr">${opt("","Todos os responsáveis",FA.resp)}${resp.map(l=>opt(l,nome(l),FA.resp)).join("")}</select>
    <select id="fo">${opt("","Todas as obras",FA.obra)}${obras.map(o=>opt(o,obraNome(o),FA.obra)).join("")}</select>
    <input id="fb" placeholder="Buscar título, obra, descrição…" value="${esc(FA.busca)}">
    <button class="btn" onclick="window.print()">🖨 Imprimir lista</button></div><div id="lista"></div>`;
  const ligar = (id, k, ev="onchange") => document.getElementById(id)[ev] = e => { FA[k] = e.target.value; listar(); };
  ligar("fsit","sit"); ligar("fr","resp"); ligar("fo","obra"); ligar("fb","busca","oninput");
  listar();
}
function listar(){
  const b = FA.busca.toLowerCase();
  let L = visiveis().filter(a => (!FA.resp || a.responsavel===FA.resp) && (!FA.obra || a.obra_id===FA.obra)

function relSemana(){

  h += `<h2>Horas por obra</h2><div class="tab"><table><tr><th>Obra</th><th>Horas</th></tr>${Object.entries(po).sort((a,b)=>b[1]-a[1]).map(([o,m])=>`<tr><td>${esc(obraNome(o))}</td><td>${hm(m)}</td></tr>`).join("") || `<tr><td colspan="2" class="vazio">—</td></tr>`}</table></div>`;
  h += `<h2>Concluídas na semana (${conc.length})</h2>` + tabelaAtiv(conc);

  return h;
}

function desenharGantt(){

  const hj = pos(HOJE) * px;
  let linhas = "", grupoAtual = null;
  L.forEach(a => {
    const g = chave(a);
    if(FG.grupo && g !== grupoAtual){ grupoAtual = g; linhas += `<div class="grow ggrupo"><div class="gnome">${esc(g)}</div><div class="garea" style="width:${larg}px"></div></div>`; }

    const dv = desvio(a), fimSol = dv && dv.tipo === "adi" ? dv.de : df;

      if(xl > 0) hach += `<i class="gdesv ${dv.tipo}" style="${xl + 60 < larg ? `left:${xl+3}px` : `right:${larg - Math.min(larg, xl) + 3}px`}">${txtDesvio(dv)}</i>`; }
    if(temOriginal(a)){ const o0 = dia(a.inicio_original)||di, o1 = dia(a.prazo_original);
      const y0 = Math.max(0,pos(o0))*px, y1 = Math.min(dias,pos(o1)+1)*px; if(y1>y0) orig = `<i class="gorig" style="left:${y0}px;width:${y1-y0}px" title="Datas originais: ${br(a.inicio_original||a.data_inicio)} → ${br(a.prazo_original||a.prazo)}"></i>`; }

      <div class="garea" style="width:${larg}px">${orig}<i class="gbar ${cls}" style="left:${x0}px;width:${Math.max(px,x1-x0)}px" title="${esc(txt)} · ${br(a.data_inicio)} → ${br(a.prazo)}"></i>${hach}${conc}</div></div>`;
  });
  document.getElementById("gantt").innerHTML = `<div class="info" style="margin-bottom:6px">${L.length} atividade(s) · ${ini.toLocaleDateString("pt-BR")} a ${fim.toLocaleDateString("pt-BR")} · muda sozinho conforme os filtros e o filtro de setores</div>
   <div class="gleg"><span><i class="gbar s-and"></i>Em andamento</span><span><i class="gbar s-faz"></i>A fazer</span><span><i class="gbar s-atr"></i>Atrasada</span><span><i class="gbar s-con"></i>Concluída</span><span><i class="ghach atr"></i>Atraso</span><span><i class="ghach adi"></i>Adiantada (concluiu antes do prazo)</span><span><i class="gorig"></i>Datas originais (antes da reprogramação)</span><span><i class="ghj"></i>Hoje</span></div>

  // Word só pinta a célula inteira: linhas baixas + borda em cima/embaixo da cor do fundo = parece barra
  const hex = c => { const m = String(c).match(/\d+/g); return (!m || String(c).startsWith("#")) ? (c || "#FFFFFF") : "#" + m.slice(0,3).map(n => (+n).toString(16).padStart(2,"0")).join("").toUpperCase(); };

function niveis(ref){

// ---------------------------------------------------------------- ANEXO: cronograma deitado (seg–sex largos, sáb/dom estreitos)
function linhasSemana(seg){
  const fimS = somaD(seg, 6);
  return visR2().filter(a => classe(a) !== "C" && a.prazo).filter(a => {
    const i0 = dia(a.data_inicio) || dia(a.prazo), c = concl(a), p = dia(a.prazo);
    const f = c ? (c > p ? c : p) : (p < HOJE ? HOJE : p);
    return i0 <= fimS && f >= seg; }).sort((x, y) => obraNome(x.obra_id).localeCompare(obraNome(y.obra_id)) || (dia(x.data_inicio)||0) - (dia(y.data_inicio)||0));
}
function anexoR2(semanas, comResp, titulo){
  const W = {at: 88, sit: 34, pr: 16}, wDias = 277 - W.at - W.sit - W.pr, larg = [1,1,1,1,1,0.45,0.45], u = wDias / larg.reduce((a,b)=>a+b,0);
  const blocos = semanas.map(s => ({s, L: somaD(s, 6) < INICIO_REG ? null : linhasSemana(s)}));
  // empacotar semanas em páginas (uma semana não é partida; semanas leves dividem a folha)
  const MAXL = 18, paginas = []; let atual = [], n = 0;
  blocos.forEach(b => { const r = 1 + Math.max(1, b.L ? b.L.length : 1);
    if(atual.length && n + r > MAXL){ paginas.push(atual); atual = []; n = 0; } atual.push(b); n += r; });
  if(atual.length) paginas.push(atual);
  const leg = `<div class="gleg2">Barras = início → prazo:<i style="background:#1F4E89"></i>concluída<i style="background:#4C9BD6"></i>em andamento<i style="background:#D5D9DE"></i>a fazer<i style="background:repeating-linear-gradient(135deg,#F28E2B 0 3px,#FFFFFF 3px 6px)"></i>atraso (prazo → conclusão ou hoje) · fim de semana em cinza</div>`;
  return paginas.map(pg => {
    const nl = pg.reduce((t, b) => t + 1 + Math.max(1, b.L ? b.L.length : 1), 0);
    const alt = Math.max(6.2, Math.min(20, 126 / nl)), fs = alt >= 15 ? 11 : alt >= 10 ? 9.5 : alt >= 8 ? 8.5 : 7, fs2 = alt >= 8 ? Math.min(8, fs - 1) : 6, hb = Math.min(8, alt * 0.5);
    let corpo = "";
    pg.forEach(b => {
      const dias = [...Array(7)].map((_, k) => somaD(b.s, k));
      corpo += `<tr class="gb" style="height:${alt}mm"><td colspan="3" style="font-size:${fs}pt">Semana de ${dm(b.s)} a ${dm(somaD(b.s, 6))}${!b.L ? ` · <span style="font-weight:400;color:#8A3D00">sem registro no RL Demandas</span>` : ""}</td>`
        + dias.map((d, k) => `<td class="d" style="font-size:${k > 4 ? 7 : Math.min(fs, 9)}pt;background:${k > 4 ? "#F4F6F8" : "#F7F9FA"};line-height:1.1">${k > 4 ? DS3[d.getDay()] + "<br>" : NOMES_D[d.getDay()] + " "}${String(d.getDate()).padStart(2,"0")}</td>`).join("") + `</tr>`;
      if(!b.L) return;
      if(!b.L.length){ corpo += `<tr style="height:${alt}mm"><td colspan="10" style="font-size:${fs}pt;color:#5A6570">Nenhuma atividade de projeto ou apoio nesta semana.</td></tr>`; return; }
      b.L.forEach(a => {
        const i0 = dia(a.data_inicio) || dia(a.prazo), p = dia(a.prazo), c = concl(a);
        const fimSol = c && c < p ? c : p, atrFim = c ? (c > p ? c : null) : (p < HOJE ? HOJE : null);
        const cor = c ? "#1F4E89" : a.status === "Em andamento" ? "#4C9BD6" : "#D5D9DE";
        const n = c ? atrasoDias(a) : 0;
        const br_ = alt >= 8 ? "<br>" : " ";
        const sit = c ? `<span class="tag ok" style="font-size:${fs2}pt">Concluída ${dm(c)}</span>${br_}<span style="font-size:${fs2}pt;${n > 0 ? "font-weight:700;color:#8A3D00" : ""}">${n > 0 ? "+" + plural(n, "dia") : "no prazo"}</span>`
          : p < HOJE ? `<span class="tag atr" style="font-size:${fs2}pt">Vencida</span>${br_}<span style="font-size:${fs2}pt;font-weight:700;color:#8A3D00">+${plural(Math.round((HOJE - p)/864e5), "dia")}</span>`
          : `<span class="tag ${a.status === "Em andamento" ? "and" : "faz"}" style="font-size:${fs2}pt">${esc(a.status === "Em andamento" ? "Em andamento" : "A fazer")}</span>`;
        const tds = dias.map((d, k) => {
          const naBarra = d >= i0 && d <= fimSol, naHach = atrFim && d > p && d <= atrFim;
          const prim = naBarra && (+d === +i0 || k === 0), ult = naBarra && (+d === +fimSol || k === 6) && !(naHach || (atrFim && +somaD(d,1) > +p && +d === +p));
          const bar = naBarra ? `<div class="abar" data-c="${cor}" style="box-sizing:border-box;background:${cor};height:${hb.toFixed(1)}mm;border-top:1px solid #22303A;border-bottom:1px solid #22303A;${prim ? "border-left:1px solid #22303A;margin-left:1px;" : ""}${ult ? "border-right:1px solid #22303A;margin-right:1px;" : ""}${prim && ult ? "border-radius:1.2mm" : prim ? "border-radius:1.2mm 0 0 1.2mm" : ult ? "border-radius:0 1.2mm 1.2mm 0" : ""}"></div>`
            : naHach ? `<div class="ahach" data-t="atr" style="box-sizing:border-box;height:${hb.toFixed(1)}mm;background:repeating-linear-gradient(135deg,#F28E2B 0 1mm,#FFFFFF 1mm 2mm);border-top:1px solid #22303A;border-bottom:1px solid #22303A;${+d === +atrFim || k === 6 ? "border-right:1px solid #22303A;border-radius:0 1.2mm 1.2mm 0;margin-right:1px;" : ""}"></div>` : "";
          return `<td class="d" style="background:${k > 4 ? "#F4F6F8" : "#FFFFFF"}">${bar}</td>`; }).join("");
        corpo += `<tr style="height:${alt}mm"><td style="font-size:${fs}pt;line-height:1.15;overflow:hidden"><b>${esc(a.titulo)}</b>${classe(a) === "A" ? ' <span style="font-weight:400;color:#5A6570">(apoio)</span>' : ""}${alt >= 7.5 ? `<br><span style="font-size:${fs-1}pt;color:#5A6570">${esc(obraNome(a.obra_id))} · ${esc(discSigla(a) || "—")}${comResp ? " · " + esc(pnome(a.responsavel)) : ""}</span>` : ""}</td>
          <td style="text-align:center;line-height:1.1">${sit}</td><td style="font-size:${fs-1}pt;text-align:center">${dm(p)}</td>${tds}</tr>`;
      });
    });
    return `<div class="apag"><div class="atit">ANEXO – CRONOGRAMA DAS ATIVIDADES</div>${leg}
      <table class="tgantt"><colgroup><col style="width:${W.at}mm"><col style="width:${W.sit}mm"><col style="width:${W.pr}mm">${larg.map(l => `<col style="width:${(l*u).toFixed(1)}mm">`).join("")}</colgroup>
      <thead><tr><th>Atividade</th><th style="text-align:center">Situação</th><th style="text-align:center">Prazo</th><th colspan="7"></th></tr></thead><tbody>${corpo}</tbody></table></div>`;
  }).join("");
}

}

    for(let i = 0; i < cs.length; i += 4) t += "<tr>" + cs.slice(i, i+4).map(c => `<td style="width:25%;border:1px solid #C3CAD0;background:#F7FAFC;text-align:center;padding:4pt 3pt"><b style="font-size:17pt;color:#005A8A">${c.querySelector("b").innerHTML}</b><br><b style="font-size:8.5pt">${c.querySelector(".l").innerHTML}</b><br><span style="font-size:7.5pt;color:#5A6570">${c.querySelector(".c").innerHTML.replace(/<em class="pior">/g, '<b style="color:#8A3D00">').replace(/<em class="sr">/g, '<span style="color:#5A6570">').replace(/<em[^>]*>/g, '<b style="color:#1F4E89">').replace(/<\/em>/g, "</b>")}</span></td>`).join("") + "</tr>";
    k.outerHTML = t + "</table>"; });
  el.querySelectorAll(".tag").forEach(t => { const c = t.classList.contains("atr") ? ["#FCE3CC","#8A3D00"] : t.classList.contains("and") ? ["#DBEBF8","#0B3D66"] : t.classList.contains("faz") ? ["#ECEEF1","#4E5660"] : ["#D3DCEA","#1F3B73"];
    t.setAttribute("style", `background:${c[0]};color:${c[1]};font-weight:bold;font-size:8pt`); });
  el.querySelectorAll(".niv").forEach(t => { const c = t.classList.contains("crit") ? ["#F28E2B","#000000"] : t.classList.contains("alto") ? ["#FCE3CC","#8A3D00"] : t.classList.contains("medio") ? ["#DBEBF8","#0B3D66"] : ["#ECEEF1","#4E5660"];
    t.setAttribute("style", `background:${c[0]};color:${c[1]};font-weight:bold;font-size:8pt;text-align:center`); });
  // anexo: barras viram células pintadas
  el.querySelectorAll(".tgantt tbody td.d").forEach(td => {
    const fundo = /F4F6F8/i.test(td.getAttribute("style") || "") ? "#F4F6F8" : (td.closest("tr").classList.contains("gb") ? "#F7F9FA" : "#FFFFFF");
    if(td.closest("tr").classList.contains("gb")){ td.setAttribute("style", `background:${fundo};font-size:7pt;text-align:center;border-left:0.5pt solid #E1E5E8`); return; }
    const b = td.querySelector(".abar"), h = td.querySelector(".ahach"), cor = b ? b.dataset.c : h ? "#F6D2B0" : fundo;
    td.setAttribute("style", `padding:0;font-size:4pt;background:${cor};border-top:5pt solid ${fundo};border-bottom:5pt solid ${fundo};border-left:0.5pt solid ${b || h ? cor : "#E1E5E8"};border-right:none`);
    td.innerHTML = "&nbsp;"; });
  el.querySelectorAll(".gleg2 i").forEach(i => { const st = i.getAttribute("style") || ""; i.outerHTML = `<span style="background:${st.includes("repeating") ? "#F6D2B0" : (st.match(/#[0-9A-F]{6}/i)||["#FFFFFF"])[0]};border:1px solid #22303A">&nbsp;&nbsp;&nbsp;&nbsp;</span> `; });
  el.querySelectorAll(".tgantt tr").forEach(tr => tr.style.height = "20pt");
  const capa = el.querySelector(".r2capa"), corpo = el.querySelector(".r2corpo"), anexo = el.querySelector(".r2anexo");
  const quebraSecao = `<span style="font-size:1pt"><br clear=all style="page-break-before:always;mso-break-type:section-break"></span>`;
  const anexoHtml = anexo ? [...anexo.querySelectorAll(".apag")].map(p => p.innerHTML).join(`<br clear=all style="page-break-before:always">`) : "";
  const css = `body,p,div,span,td,th,b,li{font-family:Arial;color:#000000} body{font-size:11pt}
   h1{font-family:Arial;font-size:13pt;text-transform:uppercase;margin:14pt 0 6pt;color:#000000} h2{font-family:Arial;font-size:11pt;margin:10pt 0 4pt;color:#000000}
   p{margin:0 0 6pt;text-align:justify}
   table.t{border-collapse:collapse;width:100%} table.t th{background:#005A8A;color:#FFFFFF;text-align:left;padding:3pt 4pt;font-size:9pt} table.t td{padding:2pt 4pt;border-bottom:1px solid #DDE3E7;font-size:9pt;vertical-align:top}
   tr.g td{background:#EEF3F7;font-weight:bold;color:#005A8A} td.n,th.n{text-align:right} .sobre{color:#8A3D00;font-weight:bold} .leg{font-size:8.5pt;text-align:center;font-style:italic}
   .fonte{font-size:8pt;border-top:1px solid #C3CAD0} .ass{text-align:center;font-size:10pt;margin-top:20pt} .ass .linha{border-top:1px solid #000000;width:200pt;margin:20pt auto 3pt}
   .r2capa{text-align:center} .r2capa .t1{font-size:20pt;font-weight:bold;margin-top:60pt} .r2capa .t2{font-size:16pt;font-weight:bold} .r2capa .t3{font-size:12pt} .r2capa .setor{font-size:13pt;font-weight:bold;margin-top:70pt} .r2capa .pes{font-size:11pt} .r2capa .mes{font-weight:bold;margin-top:120pt}
   .atit{font-size:12pt;font-weight:bold} .gleg2{font-size:8pt} table.tgantt{border-collapse:collapse;table-layout:fixed;width:100%;border:1px solid #C3CAD0} table.tgantt th{background:#ECEEF1;font-size:8pt;text-align:left}
   table.tgantt td{font-size:8pt;border-bottom:0.5pt solid #EEF1F3;vertical-align:middle} tr.gb td{background:#F7F9FA;color:#005A8A;font-weight:bold}
   @page WordSection1{size:595.3pt 841.9pt;margin:2cm 2cm 2cm 2cm;mso-header-margin:1cm;mso-footer-margin:1cm} div.WordSection1{page:WordSection1}
   @page WordSection2{size:841.9pt 595.3pt;mso-page-orientation:landscape;margin:1cm} div.WordSection2{page:WordSection2}`;
  const html = `<html xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><title>${esc(R2.cab)}</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]--><style>${css}</style></head>
<body><div class="WordSection1">${capa ? capa.outerHTML : ""}<br clear=all style="page-break-before:always">${corpo ? corpo.innerHTML : ""}</div>${anexoHtml ? quebraSecao + `<div class="WordSection2">${anexoHtml}</div>` : ""}</body></html>`;
  // MHTML
  const B = "----=_RL_PAINEL_" + Date.now(), base = "file:///C:/RL_Painel/";
  const b64Quebrado = s => s.replace(/.{1,76}/g, "$&\r\n");
  const utf8b64 = s => btoa(unescape(encodeURIComponent(s)));
  let mht = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n`
    + `--${B}\r\nContent-Location: ${base}relatorio.htm\r\nContent-Transfer-Encoding: base64\r\nContent-Type: text/html; charset="utf-8"\r\n\r\n${b64Quebrado(utf8b64(html.replace(/src="(grafico\d+\.png|logo\.jpg)"/g, `src="${base}$1"`)))}\r\n`;
  partes.forEach(p => { mht += `--${B}\r\nContent-Location: ${base}${p.nome}\r\nContent-Transfer-Encoding: base64\r\nContent-Type: ${p.tipo}\r\n\r\n${b64Quebrado(p.b64)}\r\n`; });
  mht += `--${B}--\r\n`;
  const nomeArq = (R2.tipo === "sem" ? `Relatorio semanal S${semISO(dia(FR.semana))} ${FR.semana}` : `Relatorio mensal ${FR.mes}`) + ".doc";
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([mht], {type: "application/msword"})); a.download = nomeArq;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ---------------------------------------------------------------- eventos
async function entrar(){
  const s = document.getElementById("senha").value; const m = document.getElementById("msg");
  if(!s){ m.textContent = "Digite a senha."; return; }
  m.textContent = "Abrindo…";
  try { await carregar(s); try{ sessionStorage.setItem("rlp", s); }catch(e){} m.textContent = ""; telaApp(); abrirDoLink(); }
  catch(e){ m.textContent = e.message || "Não foi possível abrir."; }
}
document.getElementById("entrar").onclick = entrar;
document.getElementById("senha").onkeydown = e => { if(e.key === "Enter") entrar(); };
document.getElementById("bSair").onclick = () => { try{ sessionStorage.removeItem("rlp"); }catch(e){} location.reload(); };
document.getElementById("bAtu").onclick = async () => { const b = document.getElementById("bAtu"); b.textContent = "…";
  try { await carregar(SENHA); telaApp(); } catch(e) { alert(e.message); } b.textContent = "↻ Atualizar"; };
document.addEventListener("keydown", e => { if(e.key === "Escape") fecharFicha(); });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
(async () => { let s = null; try{ s = sessionStorage.getItem("rlp"); }catch(e){}
  if(s){ document.getElementById("senha").value = s; entrar(); } })();
</script>
